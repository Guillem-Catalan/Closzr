name: Stats — Rep & Team Summary

on:
  schedule:
    # Weekly: Sunday 03:00 UTC (05:00 CEST / 04:00 CET)
    - cron: '0 3 * * 0'
    # Monthly: 7th of each month, 03:00 UTC
    - cron: '0 3 7 * *'
    # Quarterly: 7th of Jan/Apr/Jul/Oct, 03:00 UTC
    - cron: '0 3 7 1,4,7,10 *'

  workflow_dispatch:
    inputs:
      period_type:
        description: 'Period type to compute'
        required: true
        default: 'weekly'
        type: choice
        options:
          - weekly
          - monthly
          - quarterly

concurrency:
  group: stats-${{ github.event.inputs.period_type || 'scheduled' }}
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt

      - name: Determine period type
        id: period
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ github.event.inputs.period_type }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 3 * * 0" ]; then
            echo "type=weekly" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 3 7 1,4,7,10 *" ]; then
            echo "type=quarterly" >> $GITHUB_OUTPUT
          else
            echo "type=monthly" >> $GITHUB_OUTPUT
          fi

      - name: Run Stats Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AZURE_CLAUDE_ENDPOINT: ${{ secrets.AZURE_CLAUDE_ENDPOINT }}
          AZURE_CLAUDE_API_KEY: ${{ secrets.AZURE_CLAUDE_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -c "
          from src.pipelines.weekly.run2 import run
          run(period_type='${{ steps.period.outputs.type }}')
          "
