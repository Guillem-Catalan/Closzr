name: Sync Targets — Data Lake → ae_targets

on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * 0'  # Sunday 21:00 UTC (23:00 CEST)

concurrency:
  group: sync-targets
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt

      - name: Sync Targets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TRINO_API_KEY: ${{ secrets.TRINO_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -c "
          from src.pipelines.sync_targets.run import run
          run()
          "
